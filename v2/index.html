<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics Dashboard V2</title><style>
body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 18px;background:#f4f7fb;color:#172033}main{background:white;padding:28px;border-radius:14px;box-shadow:0 5px 22px #0001}input,button{padding:11px;margin:6px 4px 6px 0;border:1px solid #ccd3df;border-radius:7px}button{background:#2457d6;color:white;border:0;cursor:pointer}.tag{color:#2457d6;font-weight:bold}li{padding:7px}</style></head>
<body><main><p class="tag">ANALYTICS DASHBOARD · V2</p><h1>View Data</h1><p>Add values and view the records in a list.</p><form id="f"><input id="label" placeholder="Label (e.g. Sales)" required><input id="value" type="number" placeholder="Value" required><button>Add Record</button></form><h2>Records</h2><ul id="list"><li>No records added yet.</li></ul><script>const data=[];document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();data.push({label:document.getElementById('label').value,value:Number(document.getElementById('value').value)});document.getElementById('list').innerHTML=data.map(x=>'<li>'+x.label+': '+x.value+'</li>').join('');e.target.reset();});</script></main></body></html>
