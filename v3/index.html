<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics Dashboard V3</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:0 18px;background:#f4f7fb;color:#172033}main{background:white;padding:28px;border-radius:14px;box-shadow:0 5px 22px #0001}input,button{padding:11px;margin:6px 4px 6px 0;border:1px solid #ccd3df;border-radius:7px}button{background:#2457d6;color:white;border:0;cursor:pointer}.tag{color:#2457d6;font-weight:bold}.chart{height:330px}</style></head>
<body><main><p class="tag">ANALYTICS DASHBOARD · V3</p><h1>Analytics Chart</h1><p>Add data and visualize values as a bar chart.</p><form id="f"><input id="label" placeholder="Label (e.g. Sales)" required><input id="value" type="number" placeholder="Value" required><button>Add to Chart</button></form><div class="chart"><canvas id="chart"></canvas></div><script>const labels=[],values=[];const chart=new Chart(document.getElementById('chart'),{type:'bar',data:{labels,datasets:[{label:'Analytics values',data:values}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true}}}});document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();labels.push(document.getElementById('label').value);values.push(Number(document.getElementById('value').value));chart.update();e.target.reset();});</script></main></body></html>
