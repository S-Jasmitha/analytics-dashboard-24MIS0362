<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics Dashboard V1</title><style>
body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 18px;background:#f4f7fb;color:#172033}main{background:white;padding:28px;border-radius:14px;box-shadow:0 5px 22px #0001}input,button{padding:11px;margin:6px 4px 6px 0;border:1px solid #ccd3df;border-radius:7px}button{background:#2457d6;color:white;border:0;cursor:pointer}.tag{color:#2457d6;font-weight:bold}</style></head>
<body><main><p class="tag">ANALYTICS DASHBOARD · V1</p><h1>Add Data</h1><p>Enter a label and numeric value to add an analytics record.</p><form id="f"><input id="label" placeholder="Label (e.g. Sales)" required><input id="value" type="number" placeholder="Value" required><button>Add Data</button></form><p id="msg">Ready to add data.</p><p><b>V1 scope:</b> data input form.</p></main><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('msg').textContent='Added: '+document.getElementById('label').value+' = '+document.getElementById('value').value;});</script></body></html>
