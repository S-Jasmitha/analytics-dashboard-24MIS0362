apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-v1
  template:
    metadata:
      labels:
        app: analytics-v1
    spec:
      containers:
      - name: web
        image: YOUR_DOCKERHUB_USERNAME/analytics-dashboard:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-v1
spec:
  type: NodePort
  selector:
    app: analytics-v1
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-v2
  template:
    metadata:
      labels:
        app: analytics-v2
    spec:
      containers:
      - name: web
        image: YOUR_DOCKERHUB_USERNAME/analytics-dashboard:v2
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-v2
spec:
  type: NodePort
  selector:
    app: analytics-v2
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-v3
  template:
    metadata:
      labels:
        app: analytics-v3
    spec:
      containers:
      - name: web
        image: YOUR_DOCKERHUB_USERNAME/analytics-dashboard:v3
        ports:
        - containerPort: 80
    # V3 uses Chart.js CDN; the browser needs internet access to load the chart library.
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-v3
spec:
  type: NodePort
  selector:
    app: analytics-v3
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30083
